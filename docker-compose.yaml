services:
  client:
    build: ./client
    ports:
      - 3000:3000
    networks:
      - blog_network
    env_file:
      - ./client/.env

  server:
    build: ./server
    ports:
      - "5000:5000"
    networks:
      - blog_network
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - blog_network
    volumes:
      - blog_volume:/data/db

networks:
  blog_network:
    driver: bridge

volumes:
  blog_volume:
    driver: local